# Quiz Generator Configuration

llm:
  model_path: "./models/model.gguf"
  n_ctx: 16384
  n_gpu_layers: -1
  temperature: 0.7
  max_tokens: 5000

quiz:
  default_questions: 5

output:
  formats: ["docx", "html"]
  quiz_dir: "./output/quizzes"
  answer_key_dir: "./output/answer_keys"
  include_explanations: true

